[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-dashboard"
version = "0.4.1"
description = "Local Markdown, JSON, and HTML health dashboard for AI-agent context report files."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "SergioYin" }]
keywords = ["agents", "context", "dashboard", "markdown", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
agent-context-dashboard = "agent_context_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["agent_context_dashboard*"]
